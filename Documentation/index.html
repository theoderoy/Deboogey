<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f5f5f7" />
    <meta name="description" content="Deboogey Support" />
    <title>Support</title>
    <style>
      :root {
        color-scheme: light dark;
        --background: #f5f5f7;
        --surface: #ffffff;
        --text: #1d1d1f;
        --muted: #6e6e73;
        --border: #d9d9dd;
        --accent: #0066cc;
        --accent-hover: #004f9e;
        --button-text: #ffffff;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --background: #1c1c1e;
          --surface: #2c2c2e;
          --text: #f5f5f7;
          --muted: #aeaeb2;
          --border: #48484a;
          --accent: #2997ff;
          --accent-hover: #64b5ff;
        }
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        color: var(--text);
        background: var(--background);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        line-height: 1.5;
      }

      main {
        width: min(100%, 620px);
      }

      .support-card {
        padding: clamp(28px, 6vw, 48px);
        border: 1px solid var(--border);
        border-radius: 16px;
        background: var(--surface);
      }

      .intro {
        max-width: 50ch;
        margin: 0;
        color: var(--muted);
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        margin-top: 26px;
      }

      .button {
        display: inline-flex;
        min-height: 44px;
        align-items: center;
        justify-content: center;
        padding: 10px 18px;
        border: 1px solid transparent;
        border-radius: 9px;
        color: var(--button-text);
        background: var(--accent);
        font-weight: 600;
        text-decoration: none;
      }

      .button:hover {
        background: var(--accent-hover);
      }

      .button.secondary {
        border-color: var(--border);
        color: var(--text);
        background: transparent;
      }

      .button.secondary:hover {
        background: var(--background);
      }

      .button:focus-visible {
        outline: 3px solid var(--accent);
        outline-offset: 3px;
      }

      .note {
        margin: 28px 0 0;
        padding-top: 22px;
        border-top: 1px solid var(--border);
        color: var(--muted);
        font-size: 0.9rem;
      }

    </style>
  </head>
  <body>
    <main>
      <section class="support-card" aria-label="Support">
        <p class="intro">
          For help or to report a bug, open a GitHub issue.
        </p>
        <div class="actions">
          <a class="button" href="https://github.com/theoderoy/Deboogey/issues/new">
            Report a problem
          </a>
          <a class="button secondary" href="https://github.com/theoderoy/Deboogey/issues">
            Known issues
          </a>
        </div>
        <p class="note">Do not include passwords, private keys, or personal information.</p>
      </section>
    </main>
  </body>
</html>
